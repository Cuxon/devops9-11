---
- name: Verify deployed configuration without changes
  hosts: vm
  become: true
  gather_facts: true
  tasks:
    - name: Check SSH effective configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd_effective
      changed_when: false

    - name: Assert SSH hardening
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout"
          - "'permitrootlogin no' in sshd_effective.stdout"

    - name: Read container facts
      community.docker.docker_container_info:
        name: "{{ app_container_name }}"
      register: container_info

    - name: Assert container exists
      ansible.builtin.assert:
        that: container_info.exists
        fail_msg: "Контейнер приложения отсутствует"

    - name: Assert container is running and uses reviewed image
      ansible.builtin.assert:
        that:
          - container_info.container.State.Running
          - container_info.container.Config.Image == app_image + ':' + app_tag
          - container_info.container.HostConfig.PortBindings[(app_internal_port | string) + '/tcp'][0].HostIp == '127.0.0.1'

    - name: Check direct application health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}/health"
        return_content: true
      register: direct_health

    - name: Assert health payload
      ansible.builtin.assert:
        that:
          - direct_health.status == 200
          - direct_health.json.status == "ok"

    - name: Check Nginx proxy health
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        return_content: true
      register: proxy_health

    - name: Assert proxy payload
      ansible.builtin.assert:
        that:
          - proxy_health.status == 200
          - proxy_health.json.status == "ok"
