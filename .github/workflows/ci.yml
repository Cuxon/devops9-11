name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: practice-10
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            practice-10/app/requirements.txt
            practice-10/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Pylint
        run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            practice-10/app/requirements.txt
            practice-10/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        run: docker buildx build --platform linux/amd64 --load --tag "devops-ci-app:${GITHUB_SHA}" .
      - name: Smoke-test container
        run: bash scripts/smoke-container.sh "devops-ci-app:${GITHUB_SHA}" linux/amd64
      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --load --tag "devops-ci-app-arm64:${GITHUB_SHA}" .
      - name: Smoke-test ARM64 container
        run: bash scripts/smoke-container.sh "devops-ci-app-arm64:${GITHUB_SHA}" linux/arm64
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            --push .
